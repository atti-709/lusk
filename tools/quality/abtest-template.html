<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind caption test</title>
<style>
/* One review card at a time: audio and transport on top, the two caption versions side by side, the verdict last.
   Derived from the 2026-10-13 Svätonázor page; no external fonts or scripts, so the file is self-contained. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #16212c; --muted: #5b6977; --line: #d5dce3;
  --accent: #0d6a86; --accent-ink: #ffffff; --mark: #fde7a6; --mark-ink: #4a3500;
  --stage: #0b0f13; --stage-text: #ffffff; --stage-box: rgba(8, 8, 8, 0.78); --done: #2f7d4f;
  --ui: "Helvetica Neue", Arial, sans-serif;
  --cap: "Verdana", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #19212a; --ink: #e6ebf0; --muted: #93a1ae; --line: #2c3742;
    --accent: #4fb3d1; --accent-ink: #06151b; --mark: #5a4710; --mark-ink: #ffe9a8;
    --stage: #05080a; --done: #5cc285; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19212a; --ink: #e6ebf0; --muted: #93a1ae; --line: #2c3742;
  --accent: #4fb3d1; --accent-ink: #06151b; --mark: #5a4710; --mark-ink: #ffe9a8;
  --stage: #05080a; --done: #5cc285; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font: 600 1.35rem/1.2 var(--ui); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
.count { font: 500 0.85rem var(--mono); color: var(--muted); white-space: nowrap; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted);
  font: 500 0.72rem var(--mono); cursor: pointer; display: grid; place-items: center; }
.dot.voted { background: var(--done); border-color: var(--done); color: #fff; }
.dot.current { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.meta b { font-size: 1.05rem; }
.tc { font: 0.82rem var(--mono); color: var(--muted); }
.transport { display: flex; align-items: center; gap: 12px; }
button { font: inherit; color: inherit; }
button:focus-visible, .dot:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.play { width: 46px; height: 46px; flex: none; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; }
.play svg { width: 18px; height: 18px; fill: currentColor; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
.track { position: relative; flex: 1; min-width: 0; height: 40px; cursor: pointer; touch-action: none; }
.track .rail { position: absolute; left: 0; right: 0; top: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.track .fill { position: absolute; left: 0; top: 18px; height: 4px; border-radius: 2px; background: var(--accent); }
.track .tick { position: absolute; width: 1.5px; height: 9px; background: var(--muted); opacity: .7; }
.track .tick.a { top: 6px; } .track .tick.b { top: 25px; }
.track .lbl { position: absolute; left: -2px; font: 0.62rem var(--mono); color: var(--muted); }
.time { font: 0.82rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
.side { display: grid; gap: 10px; min-width: 0; align-content: start; }
.tag { font: 600 0.78rem var(--mono); letter-spacing: .08em; color: var(--muted); }
.stage { background: var(--stage); border-radius: 8px; aspect-ratio: 16 / 6; max-width: 100%; display: flex; flex-direction: column;
  justify-content: flex-end; align-items: center; padding: 12px; gap: 6px; text-align: center; }
.cap { font: 400 clamp(0.95rem, 2.2vw, 1.15rem)/1.35 var(--cap); color: var(--stage-text); background: var(--stage-box); padding: 2px 8px; border-radius: 3px; min-height: 1.35em; }
.cap:empty { visibility: hidden; }
.script { font: 0.95rem/1.6 var(--cap); display: grid; gap: 2px; }
.cue { display: grid; grid-template-columns: 5.2ch 1fr; gap: 8px; padding: 3px 6px; border-radius: 5px; cursor: pointer; }
.cue:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.cue.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.cue .t { font: 0.72rem/1.9 var(--mono); color: var(--muted); }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.opts { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; color: var(--muted); font-size: 0.85rem; }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.verdict { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 480px) { .choices { grid-template-columns: 1fr; } }
.choice { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 10px; cursor: pointer; font-weight: 600; display: grid; gap: 2px; text-align: center; }
.choice small { font: 0.7rem var(--mono); color: var(--muted); font-weight: 400; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
textarea { width: 100%; min-height: 54px; resize: vertical; font: 0.9rem/1.4 var(--ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.status { font-size: 0.82rem; color: var(--muted); }
.status.warn { color: #b4532a; }
.next { border: 0; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
.help { color: var(--muted); font-size: 0.82rem; }
.finished { border: 1px solid var(--done); border-radius: 10px; padding: 14px 18px; background: color-mix(in srgb, var(--done) 10%, var(--surface)); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-l="title"></h1>
      <p class="sub" data-l="sub"></p>
    </div>
    <div class="count" id="count">0 / 0</div>
  </header>
  <nav class="dots" id="dots" aria-label="Windows"></nav>
  <div class="finished" id="finished" hidden></div>

  <section class="card" id="card">
    <div class="meta"><b id="title"></b><span class="tc" id="where"></span></div>
    <div class="transport">
      <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="ghost" id="back" title="-5 s">−5 s</button>
      <div class="track" id="track" aria-label="Seek">
        <div class="rail"></div><div class="fill" id="fill"></div>
        <span class="lbl" style="top:-6px">A</span><span class="lbl" style="top:30px">B</span>
      </div>
      <span class="time" id="time">0:00 / 0:25</span>
    </div>
    <div class="pair">
      <div class="side"><span class="tag">A</span>
        <div class="stage"><span class="cap" id="capA"></span></div>
        <div class="script" id="scriptA"></div></div>
      <div class="side"><span class="tag">B</span>
        <div class="stage"><span class="cap" id="capB"></span></div>
        <div class="script" id="scriptB"></div></div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="showMarks" checked> <span data-l="marks"></span></label>
    </div>
    <div class="verdict">
      <div class="choices" id="choices">
        <button class="choice" data-v="A" aria-pressed="false"><span data-l="aBetter"></span><small>1</small></button>
        <button class="choice" data-v="same" aria-pressed="false"><span data-l="same"></span><small>2</small></button>
        <button class="choice" data-v="B" aria-pressed="false"><span data-l="bBetter"></span><small>3</small></button>
      </div>
      <textarea id="note" data-l="notePh" data-attr="placeholder"></textarea>
      <div class="row">
        <span class="status" id="status"></span>
        <span>
          <button class="ghost" id="copy" data-l="copy"></button>
          <button class="next" id="next" data-l="next"></button>
        </span>
      </div>
    </div>
  </section>
  <p class="help" data-l="help"></p>
</div>

<audio id="audio" preload="auto"></audio>
<script>
// Filled in by abtest.py: ITEMS (cues per side, no version names), AUDIO (data: URIs), LABELS (per language)
const ITEMS = /*ITEMS*/[];
const AUDIO = /*AUDIO*/{};
const LABELS = /*LABELS*/{};
const $ = (id) => document.getElementById(id);
const audio = $("audio");
let cur = 0, votes = {}, db = null, saving = Promise.resolve(), noteTimer = null;
const L = () => LABELS[ITEMS[cur].lang] || LABELS.sk || Object.values(LABELS)[0];

const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const clock = (s) => {
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = Math.floor(s % 60);
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
};
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// punctuation and case never count as a difference
const norm = (w) => w.toLowerCase().normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "");
const tokens = (cues) => cues.flatMap((c) => c[2].split(/\s+/).filter(Boolean));

// word-level LCS between the two sides; true = this token has no counterpart on the other side
function diffFlags(a, b) {
  a = a.map(norm); b = b.map(norm);
  const n = a.length, m = b.length, T = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    T[i][j] = a[i] === b[j] ? T[i + 1][j + 1] + 1 : Math.max(T[i + 1][j], T[i][j + 1]);
  const fa = Array(n).fill(true), fb = Array(m).fill(true);
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { fa[i] = fb[j] = false; i++; j++; }
    else if (T[i + 1][j] >= T[i][j + 1]) i++; else j++;
  }
  return [fa, fb];
}
function marked(cues, flags) {
  let k = 0;
  return cues.map((c) => c[2].split(/\s+/).filter(Boolean).map((w) => (flags[k++] ? `<mark>${esc(w)}</mark>` : esc(w))).join(" "));
}

function applyLabels() {
  const l = L();
  document.documentElement.lang = ITEMS[cur].lang;
  document.querySelectorAll("[data-l]").forEach((el) => {
    const v = l[el.dataset.l]; if (v == null) return;
    if (el.dataset.attr) el.setAttribute(el.dataset.attr, v); else el.textContent = v;
  });
}

function renderScript(it) {
  const [fa, fb] = diffFlags(tokens(it.A), tokens(it.B));
  const html = { A: marked(it.A, fa), B: marked(it.B, fb) };
  for (const side of ["A", "B"]) {
    $("script" + side).innerHTML = it[side].map((c, i) =>
      `<div class="cue" data-t="${c[0]}" data-i="${i}"><span class="t">${fmt(c[0])}</span><span>${html[side][i]}</span></div>`).join("");
  }
}
function renderTicks(it) {
  const track = $("track");
  track.querySelectorAll(".tick").forEach((t) => t.remove());
  for (const side of ["A", "B"]) for (const c of it[side]) {
    const t = document.createElement("span");
    t.className = "tick " + side.toLowerCase();
    t.style.left = (100 * c[0] / it.dur) + "%";
    track.appendChild(t);
  }
}
function at(cues, t) { const c = cues.find((c) => t >= c[0] && t < c[1]); return c ? c[2] : ""; }
function tick() {
  const it = ITEMS[cur], t = audio.currentTime || 0;
  for (const side of ["A", "B"]) {
    $("cap" + side).textContent = at(it[side], t);
    $("script" + side).querySelectorAll(".cue").forEach((el) => {
      const c = it[side][+el.dataset.i];
      el.classList.toggle("on", t >= c[0] && t < c[1]);
    });
  }
  $("fill").style.width = (100 * Math.min(t, it.dur) / it.dur) + "%";
  $("time").textContent = `${fmt(t)} / ${fmt(it.dur)}`;
  if (!audio.paused) requestAnimationFrame(tick);
}
const rated = () => ITEMS.filter((it) => votes[it.id]?.choice).length;
function renderDots() {
  $("dots").innerHTML = ITEMS.map((it, i) =>
    `<button class="dot${votes[it.id]?.choice ? " voted" : ""}${i === cur ? " current" : ""}" data-i="${i}" aria-label="${i + 1}">${i + 1}</button>`).join("");
  const n = rated(), l = L();
  $("count").textContent = `${n} / ${ITEMS.length}`;
  $("finished").hidden = n < ITEMS.length;
  $("finished").textContent = (db ? l.doneSaved : l.doneCopy).replace("{n}", ITEMS.length);
}
function renderVote() {
  const v = votes[ITEMS[cur].id] || {};
  document.querySelectorAll(".choice").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v.choice)));
  if (document.activeElement !== $("note")) $("note").value = v.note || "";
}
function show(i) {
  cur = (i + ITEMS.length) % ITEMS.length;
  const it = ITEMS[cur];
  audio.pause();
  audio.src = AUDIO[it.id];
  applyLabels();
  $("title").textContent = `${L().window} ${cur + 1} · ${it.item}`;
  $("where").textContent = `${clock(it.at)} → ${clock(it.at + it.dur)}`;
  renderScript(it); renderTicks(it); renderDots(); renderVote(); setPlayIcon(); tick();
  document.body.classList.toggle("nomarks", !$("showMarks").checked);
}
function setPlayIcon() {
  $("playIcon").innerHTML = audio.paused ? '<path d="M7 4v16l13-8z"/>' : '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  $("play").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
}
function toggle() { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); }
function status(t, warn) { $("status").textContent = t; $("status").classList.toggle("warn", !!warn); }

// votes: {windowId: {choice: "A"|"B"|"same", note}}; stored in the artifact database when the page runs in claude.ai
function save(id) {
  const v = votes[id], l = L();
  if (!db) { status(l.notSaved, true); return; }
  status(l.saving);
  saving = saving.then(() => db.doc(`votes/${id}`).set({ choice: v.choice || null, note: v.note || "" }))
    .then(() => status(l.saved), () => status(l.saveFailed, true));
}
function vote(v) {
  const id = ITEMS[cur].id;
  votes[id] = { ...(votes[id] || {}), choice: v };
  renderVote(); renderDots(); save(id);
}
function votesJson() {
  const out = {};
  for (const it of ITEMS) if (votes[it.id]?.choice) out[it.id] = { choice: votes[it.id].choice, note: votes[it.id].note || "" };
  return JSON.stringify(out, null, 1);
}
async function copyVotes() {
  const text = votesJson();
  try { await navigator.clipboard.writeText(text); status(L().copied); return; } catch {}
  const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); status(L().copied); } catch { window.prompt(L().copy, text); }
  ta.remove();
}

$("play").onclick = toggle;
$("back").onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 5); tick(); };
audio.onplay = audio.onpause = () => { setPlayIcon(); tick(); };
audio.onended = setPlayIcon;
$("choices").onclick = (e) => { const b = e.target.closest(".choice"); if (b) vote(b.dataset.v); };
$("next").onclick = () => show(cur + 1);
$("copy").onclick = copyVotes;
$("dots").onclick = (e) => { const b = e.target.closest(".dot"); if (b) show(+b.dataset.i); };
for (const side of ["A", "B"]) $("script" + side).onclick = (e) => {
  const c = e.target.closest(".cue"); if (!c) return;
  audio.currentTime = +c.dataset.t; audio.play().catch(() => {});
};
$("showMarks").onchange = () => document.body.classList.toggle("nomarks", !$("showMarks").checked);
$("note").oninput = () => {
  const id = ITEMS[cur].id;
  votes[id] = { ...(votes[id] || {}), note: $("note").value };
  clearTimeout(noteTimer); noteTimer = setTimeout(() => votes[id].choice && save(id), 800);
};
function seekFrom(e) {
  const r = $("track").getBoundingClientRect();
  audio.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * ITEMS[cur].dur; tick();
}
$("track").onpointerdown = (e) => { seekFrom(e); $("track").setPointerCapture(e.pointerId); };
$("track").onpointermove = (e) => { if (e.buttons) seekFrom(e); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); toggle(); }
  else if (e.key === "1") vote("A"); else if (e.key === "2") vote("same"); else if (e.key === "3") vote("B");
  else if (e.key === "ArrowRight") show(cur + 1); else if (e.key === "ArrowLeft") show(cur - 1);
});
const style = document.createElement("style");
style.textContent = "body.nomarks mark { background: none; color: inherit; padding: 0; }";
document.head.appendChild(style);

show(0);
(async () => {
  try { db = await window.claude?.use("db"); } catch { db = null; }
  if (!db) { status(L().notSaved, true); renderDots(); return; }
  status(L().ready);
  try {
    db.collection("votes").onSnapshot((snap) => {
      for (const d of snap.docs) {
        // only this build's windows (an older build's votes share the collection); a vote made here stays authoritative
        if (!ITEMS.some((it) => it.id === d.id) || votes[d.id]) continue;
        votes[d.id] = { ...d.data() };
      }
      renderVote(); renderDots();
    }, () => status(L().lost, true));
  } catch { status(L().lost, true); }
})();
</script>
</body>
</html>
